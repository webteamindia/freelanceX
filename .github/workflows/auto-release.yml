name: Auto-release payouts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Release held payouts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          AUTO_RELEASE_DAYS: ${{ secrets.AUTO_RELEASE_DAYS }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Add it in GitHub Actions secrets to run payouts."
            exit 0
          fi
          pnpm exec prisma generate
          node scripts/auto-release-payouts.mjs
